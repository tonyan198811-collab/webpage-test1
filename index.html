<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>吹響吧！上低音號｜主題頁</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div class="hero__overlay"></div>
    <div class="container hero__content">
      <p class="hero__kicker">Sound! Euphonium</p>
      <h1>吹響吧！上低音號｜主題頁</h1>
      <p class="hero__subtitle-jp">響け！ユーフォニアム｜テーマページ</p>
      <p class="hero__intro">
        《吹響吧！上低音號》第一季以北宇治高中吹奏樂部為舞台，將友情、競爭與成長譜成細膩旋律。
        在安靜的日常與熱烈的合奏之間，青春的悸動悄悄被放大。
      </p>
    </div>
  </header>

  <main class="container">
    <section class="showcase" aria-label="首頁展示圖">
      <div class="showcase__grid">
        <figure class="card card--polaroid card--a">
          <img src="./第一张.png" alt="黃前久美子的角色照片" />
          <figcaption>黃前久美子</figcaption>
        </figure>
        <figure class="card card--polaroid card--b">
          <img src="./第二张.png" alt="高坂麗奈的角色照片" />
          <figcaption>高坂麗奈</figcaption>
        </figure>
        <figure class="card card--polaroid card--c">
          <img src="./第三张.png" alt="川島綠輝的角色照片" />
          <figcaption>川島綠輝</figcaption>
        </figure>
        <figure class="card card--polaroid card--d">
          <img src="./第四张.png" alt="加藤葉月的角色照片" />
          <figcaption>加藤葉月</figcaption>
        </figure>
      </div>
    </section>

    <section class="album album--offset-left" aria-label="第一個圖集">
      <div class="carousel" data-carousel="album-1">
        <button class="carousel__btn carousel__btn--prev" aria-label="上一張">❮</button>

        <div class="carousel__viewport">
          <img src="./SCAN_01-2 (1).jpg" alt="第一個圖集圖片" />
        </div>

        <button class="carousel__btn carousel__btn--next" aria-label="下一張">❯</button>
      </div>
    </section>

    <section class="album album--offset-right" aria-label="第二個圖集">
      <div class="carousel" data-carousel="album-2">
        <button class="carousel__btn carousel__btn--prev" aria-label="上一張">❮</button>

        <div class="carousel__viewport">
          <img src="./其他1.png" alt="第二個圖集圖片" />
        </div>

        <button class="carousel__btn carousel__btn--next" aria-label="下一張">❯</button>
      </div>
    </section>


    <aside id="floating-message-art" class="floating-message-art" aria-hidden="true">
      <p id="floating-message-text" class="floating-message-art__text"></p>
    </aside>

    <section class="message-board" aria-label="留言板">
      <p class="message-board__hint">欢迎留下对角色或本作品想说的话~我们将筛选可爱的留言做成网页背景~</p>
      <p class="message-board__hint-jp">キャラクターや作品への想いを、ぜひここに残してください。かわいいメッセージはページ背景として紹介するかもしれません。</p>

      <form id="message-form" class="message-form">
        <div class="message-form__field">
          <label for="name-input">署名</label>
          <input id="name-input" name="name" type="text" maxlength="16" placeholder="请输入署名（建议 12-16 字以内）" required />
          <span id="name-count" class="message-form__count">0 / 16</span>
        </div>
        <div class="message-form__field">
          <label for="message-input">留言内容</label>
          <textarea id="message-input" name="message" maxlength="100" placeholder="写下你的留言（最多 100 字）" required></textarea>
        </div>
        <div class="message-form__meta">
          <span id="message-count">0 / 100</span>
          <button type="submit">发表留言</button>
        </div>
      </form>

      <p id="message-status" class="message-status" aria-live="polite"></p>

      <section class="message-section" aria-label="人氣留言">
        <h2 class="message-section__title">人氣留言</h2>
        <ul id="popular-list" class="message-list" aria-label="人氣留言列表"></ul>
      </section>

      <section class="message-section" aria-label="最新留言">
        <h2 class="message-section__title">最新留言</h2>
        <ul id="message-list" class="message-list" aria-label="已发表留言"></ul>
        <div class="message-pagination">
          <button id="prev-page" type="button">上一頁</button>
          <span id="page-indicator">第 1 頁</span>
          <button id="next-page" type="button">下一頁</button>
        </div>
      </section>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="script.js"></script>
</body>
</html>
